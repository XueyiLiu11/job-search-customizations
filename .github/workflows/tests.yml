name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python3 -m unittest -v
      - name: Run fictional example
        run: python3 pipeline.py example_jobs.jsonl --profile profile.example.json --today 2026-09-16
